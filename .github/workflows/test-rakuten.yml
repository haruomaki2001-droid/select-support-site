name: Test Rakuten Ranking

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Rakuten Smartphone Ranking test
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          echo "========================================"
          echo "SMARTPHONE RANKING"
          echo "========================================"

          curl -G "https://app.rakuten.co.jp/services/api/IchibaItem/Ranking/20170628" \
            --data-urlencode "format=json" \
            --data-urlencode "applicationId=$RAKUTEN_APPLICATION_ID" \
            --data-urlencode "accessKey=$RAKUTEN_ACCESS_KEY" \
            --data-urlencode "genreId=560202" \
            --data-urlencode "period=day" \
            --data-urlencode "page=1" \
            --data-urlencode "hits=5"

          echo
