name: Test Rakuten Product Details

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Rakuten Product Details test
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          for KEYWORD in "iPhone" "ノートパソコン" "マウス"; do
            echo "========================================"
            echo "SEARCH: $KEYWORD"
            echo "========================================"

            curl -G "https://openapi.rakuten.co.jp/ichibaproduct/api/Product/Search/20250801" \
              -H "Origin: https://supisho.com" \
              --data-urlencode "format=json" \
              --data-urlencode "applicationId=$RAKUTEN_APPLICATION_ID" \
              --data-urlencode "accessKey=$RAKUTEN_ACCESS_KEY" \
              --data-urlencode "keyword=$KEYWORD" \
              --data-urlencode "hits=5"
            
            echo
          done