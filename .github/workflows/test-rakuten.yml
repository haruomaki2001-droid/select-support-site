name: Test Rakuten Weekly Smartphone Ranking

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get weekly smartphone ranking
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          curl -sS -G "https://openapi.rakuten.co.jp/ichibaranking/api/IchibaItem/Ranking/20220601" \
            -H "Origin: https://supisho.com" \
            -H "Referer: https://supisho.com/" \
            --data-urlencode "format=json" \
            --data-urlencode "formatVersion=2" \
            --data-urlencode "applicationId=$RAKUTEN_APPLICATION_ID" \
            --data-urlencode "accessKey=$RAKUTEN_ACCESS_KEY" \
            --data-urlencode "genreId=560202" \
            --data-urlencode "period=weekly" \
            --data-urlencode "page=1" \
          | jq .