name: Test Rakuten itemCaption (target item by itemCode)

on:
  workflow_dispatch:
    inputs:
      itemCode:
        description: "商品コード(shopCode:内部ID)"
        required: true
        default: "superdeal:10006078"

jobs:
  test-item-caption:
    runs-on: ubuntu-latest
    steps:
      - name: Call IchibaItem Search API (by itemCode)
        env:
          APP_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          ITEM_CODE: ${{ github.event.inputs.itemCode }}
        run: |
          set -euo pipefail
          curl -s -G "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701" \
            -H "Referer: https://supisho.com" \
            -H "Origin: https://supisho.com" \
            --data-urlencode "applicationId=${APP_ID}" \
            --data-urlencode "accessKey=${ACCESS_KEY}" \
            --data-urlencode "itemCode=${ITEM_CODE}" \
            --data-urlencode "availability=0" \
            --data-urlencode "elements=itemName,itemCode,itemCaption,itemUrl" \
            -o response.json
          echo "===== RESULT ====="
          cat response.json

      - name: Save response
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-item-caption
          path: response.json